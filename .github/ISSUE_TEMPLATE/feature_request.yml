name: Feature request
description: Propose a focused improvement to Prompt Editor
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow need, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain expected user-visible behavior and important edge cases.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Platform scope
      options:
        - Cross-platform editor behavior
        - macOS
        - Windows (experimental)
        - Linux (experimental)
        - Build, test, or release tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the support matrix.
          required: true
