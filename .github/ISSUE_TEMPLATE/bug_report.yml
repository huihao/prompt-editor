name: Bug report
description: Report a reproducible defect in Prompt Editor
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private prompts, terminal output, or other sensitive data.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS Apple Silicon
        - macOS Intel
        - Windows (experimental)
        - Linux X11 (experimental)
        - Linux Wayland (experimental)
        - Editor/web layer
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or revision
      placeholder: 0.1.0 or git commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Remove secrets, personal paths, prompt content, and terminal content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials and private data.
          required: true
