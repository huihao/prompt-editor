[package]
name = "prompt-editor-linux"
version = "0.1.0"
edition = "2021"
description = "Experimental Linux shell for Prompt Editor"
license = "MIT"
publish = false

[dependencies]
gtk4 = { version = "0.9", features = ["v4_8"] }
webkit6 = { version = "0.4", package = "webkit6" }
glib = "0.20"
gio = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

# For X11 global shortcuts
x11rb = { version = "0.13", features = ["xkb"], optional = true }

# For Wayland (TODO)
wayland-client = { version = "0.31", optional = true }

# Clipboard
cli-clipboard = "0.4"

[features]
default = ["x11"]
x11 = ["dep:x11rb"]
wayland = ["dep:wayland-client"]

[[bin]]
name = "prompt-editor"
path = "src/main.rs"
