<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      user-select: none;
      -webkit-app-region: drag;
    }
    #toolbar .actions {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    #toolbar .title {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.7;
    }
    #toolbar button {
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      min-height: 28px;
    }
    #toolbar button:hover { 
      background: var(--btn-hover); 
      border-color: #0066ff;
    }
    #toolbar button.icon-btn-toolbar {
      padding: 6px;
      font-size: 16px;
    }
    #toolbar button.icon-btn-toolbar svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }
    #toolbar button.primary {
      background: #0066ff;
      color: #fff;
      border-color: #0055dd;
    }
    #toolbar button.primary:hover { background: #0055dd; }
    #toolbar button.secondary {
      background: var(--btn-bg);
      color: var(--btn-fg);
    }
    #toolbar button.secondary:hover { background: var(--btn-hover); }
    #toolbar button.accent {
      background: #34c759;
      color: #fff;
      border-color: #30b350;
    }
    #toolbar button.accent:hover { background: #30b350; }
    #toolbar select {
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    #toolbar select:focus {
      border-color: #0066ff;
    }
    #accessibility-permission-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      background: #fff4ce;
      color: #5c4300;
      border-bottom: 1px solid #e6c75a;
      font-size: 12px;
    }
    #accessibility-permission-banner[hidden] { display: none; }
    #accessibility-permission-banner .permission-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    #accessibility-permission-banner button {
      border: 1px solid #b28b00;
      border-radius: 5px;
      padding: 4px 8px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 12px;
    }
    #accessibility-permission-banner button.primary {
      background: #8a6800;
      color: #fff;
    }
    @media (prefers-color-scheme: dark) {
      #accessibility-permission-banner {
        background: #3e350f;
        color: #f6df87;
        border-bottom-color: #77631b;
      }
      #accessibility-permission-banner button { border-color: #bda43e; }
      #accessibility-permission-banner button.primary { background: #b28b00; color: #171300; }
    }
    .toolbar-separator {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
    }

    #editor-container { flex: 1; overflow: auto; }
    .cm-editor { height: 100%; }
    .cm-editor .cm-scroller { overflow: auto; }
    .cm-editor .cm-content { padding: 12px 16px; }
    
    /* Image styles in editor */
    .cm-editor img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 4px 0;
    }
    
    /* File Reference Styles */
    .cm-file-reference {
      background: rgba(0, 102, 255, 0.12);
      border-radius: 3px;
      padding: 1px 4px;
      color: #0066ff;
      cursor: pointer;
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid rgba(0, 102, 255, 0.3);
      transition: background 0.15s, border-color 0.15s;
    }
    
    .cm-file-reference:hover,
    .cm-file-reference-hover {
      background: rgba(0, 102, 255, 0.2);
      border-bottom-color: rgba(0, 102, 255, 0.5);
    }
    
    .cm-file-reference-invalid {
      background: rgba(255, 59, 48, 0.12);
      border-radius: 3px;
      padding: 1px 4px;
      color: #ff3b30;
      cursor: pointer;
      font-weight: 500;
      text-decoration: line-through;
      border-bottom: 1px solid rgba(255, 59, 48, 0.3);
    }
    
    .cm-file-reference-invalid:hover {
      background: rgba(255, 59, 48, 0.2);
    }
    
    /* Dark theme adjustments */
    @media (prefers-color-scheme: dark) {
      .cm-file-reference {
        background: rgba(0, 122, 255, 0.2);
        color: #64b5f6;
        border-bottom-color: rgba(100, 181, 246, 0.4);
      }
      
      .cm-file-reference:hover,
      .cm-file-reference-hover {
        background: rgba(0, 122, 255, 0.3);
      }
      
      .cm-file-reference-invalid {
        background: rgba(255, 82, 82, 0.2);
        color: #ff5252;
        border-bottom-color: rgba(255, 82, 82, 0.4);
      }
    }
    
    /* Workspace Bar */
    #workspace-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      background: var(--btn-bg, #f5f5f7);
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-size: 12px;
      gap: 8px;
    }
    
    #workspace-info {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    #workspace-info.has-workspace {
      opacity: 1;
      font-weight: 500;
      color: #0066ff;
    }

    /* Workspace History Dropdown */
    #workspace-history-select {
      background: var(--bg, #fff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--fg, #1d1d1f);
      cursor: pointer;
      outline: none;
      max-width: 150px;
      transition: border-color 0.15s;
    }

    #workspace-history-select:hover,
    #workspace-history-select:focus {
      border-color: #0066ff;
    }

    #workspace-history-select option {
      font-size: 12px;
      padding: 4px;
    }
    
    #btn-switch-workspace,
    #btn-rescan-workspace,
    #btn-clear-workspace {
      padding: 4px;
      font-size: 12px;
      background: var(--bg, #fff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      min-height: 24px;
    }

    #btn-switch-workspace:hover,
    #btn-rescan-workspace:hover,
    #btn-clear-workspace:hover {
      opacity: 1;
      border-color: #0066ff;
    }
    
    @media (prefers-color-scheme: dark) {
      #workspace-bar {
        background: var(--btn-bg, #2d2d2d);
        border-color: var(--border, #3e3e3e);
      }
      
      #workspace-info.has-workspace {
        color: #64b5f6;
      }

      #workspace-history-select {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
        color: var(--fg, #d4d4d4);
      }
      
      #btn-switch-workspace,
      #btn-rescan-workspace,
      #btn-clear-workspace {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
        color: var(--fg, #d4d4d4);
      }
    }
    
    /* ─── AI Ghost Text ────────────────────────────────── */
    .cm-ai-suggestion {
      color: #888;
      opacity: 0.6;
      font-style: italic;
      pointer-events: none;
      user-select: none;
      white-space: pre;
    }
    .cm-ai-suggestion-loading {
      animation: ai-pulse 1s ease-in-out infinite;
    }
    @keyframes ai-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @media (prefers-color-scheme: dark) {
      .cm-ai-suggestion { color: #aaa; }
    }

    /* ─── AI Enhance button accent ───────────────────────── */
    #toolbar button.ai-enhance-btn {
      color: #a855f7;
      border-color: rgba(168,85,247,0.35);
    }
    #toolbar button.ai-enhance-btn:hover {
      background: rgba(168,85,247,0.12);
      border-color: #a855f7;
    }
    @media (prefers-color-scheme: dark) {
      #toolbar button.ai-enhance-btn { color: #c084fc; border-color: rgba(192,132,252,0.35); }
      #toolbar button.ai-enhance-btn:hover { background: rgba(192,132,252,0.15); border-color: #c084fc; }
    }

    #toolbar button.ai-orchestrate-btn {
      color: #087f5b;
      border-color: rgba(8,127,91,0.35);
    }
    #toolbar button.ai-orchestrate-btn:hover {
      background: rgba(8,127,91,0.1);
      border-color: #087f5b;
    }

    /* ─── Prompt Orchestration ───────────────────────────── */
    .prompt-workflow-overlay {
      position: fixed; inset: 0; z-index: 1120;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    }
    .prompt-workflow-modal {
      width: min(1360px, 96vw); height: min(900px, 92vh);
      display: flex; flex-direction: column; overflow: hidden;
      color: var(--fg, #1d1d1f); background: var(--bg, #fff);
      border: 1px solid var(--border, #e5e5e5); border-radius: 8px;
      box-shadow: 0 24px 72px rgba(0,0,0,0.28);
    }
    .prompt-workflow-header {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
      padding: 14px 18px; border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .prompt-workflow-header h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
    .prompt-workflow-header p { margin: 3px 0 0; font-size: 12px; opacity: 0.62; }
    .prompt-workflow-icon-button {
      width: 28px; height: 28px; flex: 0 0 28px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0; border: 1px solid transparent; border-radius: 6px;
      color: inherit; background: transparent; cursor: pointer; font-size: 15px;
    }
    .prompt-workflow-icon-button:hover { background: var(--btn-hover, #ebebeb); border-color: var(--border, #e5e5e5); }
    .prompt-workflow-icon-button:disabled { opacity: 0.3; cursor: not-allowed; }
    .prompt-workflow-icon-button.danger { color: #c92a2a; }
    .prompt-workflow-source {
      padding: 10px 18px; background: var(--btn-bg, #f5f5f7);
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .prompt-workflow-source span { display: block; font-size: 11px; font-weight: 600; opacity: 0.6; }
    .prompt-workflow-source p {
      max-height: 58px; margin: 4px 0 0; overflow: auto;
      font-size: 12px; line-height: 1.45; white-space: pre-wrap;
    }
     .prompt-workflow-status {
       flex: 1; display: grid; place-items: center; padding: 32px;
       font-size: 13px; text-align: center;
     }
     .prompt-workflow-status[hidden] { display: none; }
     .prompt-workflow-status.is-loading { color: #087f5b; }
    .prompt-workflow-status.is-error { color: #c92a2a; }
    .prompt-workflow-editor-body { flex: 1; min-height: 0; overflow: auto; padding: 16px 18px 28px; }
    .prompt-workflow-title-field { display: grid; gap: 6px; font-size: 12px; font-weight: 600; }
    .prompt-workflow-title-field input,
    .prompt-workflow-card input,
    .prompt-workflow-card textarea {
      width: 100%; box-sizing: border-box; color: inherit; background: var(--bg, #fff);
      border: 1px solid var(--border, #d8d8dc); border-radius: 6px; outline: none;
    }
    .prompt-workflow-title-field input { padding: 8px 10px; font-size: 14px; }
    .prompt-workflow-title-field input:focus,
    .prompt-workflow-card input:focus,
    .prompt-workflow-card textarea:focus { border-color: #087f5b; box-shadow: 0 0 0 2px rgba(8,127,91,0.12); }
    .prompt-workflow-stages { margin-top: 16px; }
    .prompt-workflow-stage {
      padding: 12px; background: var(--btn-bg, #f5f5f7);
      border: 1px solid var(--border, #e5e5e5); border-radius: 8px;
    }
    .prompt-workflow-stage-header,
    .prompt-workflow-card-toolbar,
    .prompt-workflow-footer,
    .prompt-workflow-manager-item,
    .prompt-workflow-manager-actions {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .prompt-workflow-stage-number { font-size: 12px; font-weight: 700; }
    .prompt-workflow-parallel-badge {
      margin-left: 8px; padding: 2px 6px; border-radius: 4px;
      color: #087f5b; background: rgba(8,127,91,0.1); font-size: 10px; font-weight: 700;
    }
    .prompt-workflow-stage-actions { display: flex; gap: 2px; }
    .prompt-workflow-prompt-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
      gap: 10px; margin-top: 10px;
    }
    .prompt-workflow-card {
      min-width: 0; padding: 10px; background: var(--bg, #fff);
      border: 1px solid var(--border, #d8d8dc); border-radius: 7px;
    }
    .prompt-workflow-card-toolbar { margin-bottom: 8px; font-size: 10px; font-weight: 700; opacity: 0.75; }
    .prompt-workflow-card-toolbar > div { display: flex; gap: 1px; }
    .prompt-workflow-card input { padding: 7px 8px; font-size: 12px; font-weight: 600; }
    .prompt-workflow-card textarea {
      min-height: 122px; margin-top: 7px; padding: 8px; resize: vertical;
      font: 12px/1.5 ui-monospace, 'SF Mono', Menlo, monospace;
    }
    .prompt-workflow-add-prompt {
      margin-top: 10px; padding: 5px 8px; border: 0; background: transparent;
      color: #087f5b; cursor: pointer; font-size: 11px; font-weight: 600;
    }
    .prompt-workflow-add-stage { margin-top: 12px; }
    .prompt-workflow-sequence-arrow { height: 24px; display: grid; place-items: center; color: #087f5b; }
    .prompt-workflow-footer {
      justify-content: flex-start; padding: 12px 18px;
      border-top: 1px solid var(--border, #e5e5e5);
    }
    .prompt-workflow-footer-spacer { flex: 1; }
    .ai-usage-line { font-size: 11px; opacity: 0.7; white-space: nowrap; }
    .ai-usage-line[hidden] { display: none; }
    .ai-usage-section { border-top: 1px solid var(--border, #e5e5e5); margin-top: 16px; padding-top: 16px; }
    .ai-usage-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .ai-usage-heading h3, .ai-usage-breakdown h4, .ai-usage-days h4 { font-size: 12px; margin: 0; }
    .ai-usage-heading .ai-btn-secondary { font-size: 11px; padding: 4px 7px; }
    .ai-usage-summary { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 9px; font-size: 11px; }
    .ai-usage-summary strong { font-variant-numeric: tabular-nums; }
    .ai-usage-empty { margin-top: 8px; font-size: 12px; opacity: 0.65; }
    .ai-usage-breakdown { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
    .ai-usage-breakdown ul { list-style: none; margin: 7px 0 0; padding: 0; font-size: 11px; }
    .ai-usage-breakdown li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
    .ai-usage-breakdown li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ai-usage-days { margin-top: 14px; }
    .ai-usage-table-wrap { max-height: 160px; margin-top: 7px; overflow: auto; border: 1px solid var(--border, #e5e5e5); border-radius: 5px; }
    .ai-usage-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .ai-usage-table th, .ai-usage-table td { padding: 5px 7px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border, #e5e5e5); }
    .ai-usage-table th:first-child, .ai-usage-table td:first-child { text-align: left; }
    .ai-usage-table th { position: sticky; top: 0; background: var(--bg, #fff); }
    .prompt-workflow-manager { height: min(620px, 82vh); max-width: 820px; }
    .prompt-workflow-manager-list { flex: 1; min-height: 0; overflow: auto; padding: 10px 18px 18px; }
    .prompt-workflow-manager-item { padding: 12px 0; border-bottom: 1px solid var(--border, #e5e5e5); }
    .prompt-workflow-manager-summary { min-width: 0; display: grid; gap: 4px; }
    .prompt-workflow-manager-summary strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .prompt-workflow-manager-summary span { font-size: 11px; opacity: 0.6; }
    .prompt-workflow-empty { padding: 52px 20px; text-align: center; font-size: 13px; opacity: 0.6; }
    @media (prefers-color-scheme: dark) {
      #toolbar button.ai-orchestrate-btn { color: #63e6be; border-color: rgba(99,230,190,0.35); }
      #toolbar button.ai-orchestrate-btn:hover { background: rgba(99,230,190,0.12); border-color: #63e6be; }
      .prompt-workflow-modal, .prompt-workflow-card { background: #1e1e1e; border-color: #3e3e3e; }
      .prompt-workflow-source, .prompt-workflow-stage { background: #272727; border-color: #3e3e3e; }
      .ai-usage-section, .ai-usage-table-wrap, .ai-usage-table th, .ai-usage-table td { border-color: #3e3e3e; }
      .ai-usage-table th { background: #1e1e1e; }
      .prompt-workflow-title-field input, .prompt-workflow-card input, .prompt-workflow-card textarea {
        color: #f5f5f7; background: #1e1e1e; border-color: #4a4a4a;
      }
      .prompt-workflow-parallel-badge { color: #63e6be; background: rgba(99,230,190,0.12); }
      .prompt-workflow-add-prompt, .prompt-workflow-sequence-arrow, .prompt-workflow-status.is-loading { color: #63e6be; }
    }
    @media (max-width: 620px) {
      .prompt-workflow-overlay { padding: 8px; }
      .prompt-workflow-modal { width: 100%; height: 94vh; }
      .prompt-workflow-header, .prompt-workflow-footer { padding-left: 12px; padding-right: 12px; }
      .ai-usage-line { white-space: normal; }
      .ai-usage-breakdown { grid-template-columns: 1fr; }
      .prompt-workflow-source, .prompt-workflow-editor-body { padding-left: 12px; padding-right: 12px; }
      .prompt-workflow-manager-item { align-items: flex-start; }
      .prompt-workflow-manager-actions { flex-wrap: wrap; justify-content: flex-end; }
    }

    /* ─── Application Settings ───────────────────────────── */
    .settings-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 1100;
      backdrop-filter: blur(4px);
    }
    .settings-modal {
      background: var(--bg, #fff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 8px;
      width: 680px;
      min-height: 460px;
      max-width: 92vw;
      max-height: 86vh;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .settings-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .settings-header h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .settings-close,
    .ai-settings-close {
      background: none; border: none; font-size: 20px; cursor: pointer;
      color: var(--fg, #1d1d1f); opacity: 0.6; line-height: 1;
      padding: 0 4px;
    }
    .settings-close:hover,
    .ai-settings-close:hover { opacity: 1; }
    .settings-layout { display: grid; grid-template-columns: 164px 1fr; flex: 1; min-height: 0; }
    .settings-tabs {
      padding: 10px 8px;
      border-right: 1px solid var(--border, #e5e5e5);
      background: var(--btn-bg, #f5f5f7);
    }
    .settings-tabs button {
      display: block; width: 100%; padding: 8px 10px; border: 0; border-radius: 6px;
      background: transparent; color: var(--fg, #1d1d1f); cursor: pointer;
      text-align: left; font-size: 13px;
    }
    .settings-tabs button:hover { background: var(--btn-hover, #ebebeb); }
    .settings-tabs button.active { background: #e4e4e7; font-weight: 600; }
    .settings-content { min-width: 0; overflow: auto; display: flex; flex-direction: column; }
    .settings-section { padding: 20px; }
    .settings-field { display: flex; flex-direction: column; gap: 7px; max-width: 320px; }
    .settings-field label { font-size: 13px; font-weight: 600; }
    .settings-field select {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border, #e5e5e5);
      border-radius: 7px; background: var(--btn-bg, #f5f5f7); color: var(--fg, #1d1d1f);
      font-size: 13px;
    }
    .ai-settings-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .ai-settings-field { display: flex; flex-direction: column; gap: 5px; }
    .ai-settings-field label {
      font-size: 12px; font-weight: 600;
      color: var(--fg, #1d1d1f); opacity: 0.7; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .ai-settings-field select,
    .ai-settings-field input[type="text"],
    .ai-settings-field input[type="password"] {
      width: 100%; padding: 7px 10px; font-size: 13px;
      background: var(--btn-bg, #f5f5f7);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 7px; color: var(--fg, #1d1d1f);
      outline: none; box-sizing: border-box;
    }
    .ai-settings-field select:focus,
    .ai-settings-field input:focus { border-color: #a855f7; }
    .ai-model-row { display: flex; gap: 8px; }
    .ai-model-row select { flex: 0 0 auto; max-width: 180px; }
    .ai-model-row input { flex: 1; }
    .ai-apikey-row { display: flex; gap: 8px; }
    .ai-apikey-row input { flex: 1; }
    .ai-apikey-row button {
      padding: 7px 10px; font-size: 14px; cursor: pointer;
      background: var(--btn-bg, #f5f5f7); border: 1px solid var(--border, #e5e5e5);
      border-radius: 7px; color: var(--fg, #1d1d1f);
    }
    .ai-settings-toggle { flex-direction: row !important; align-items: center; justify-content: space-between; }
    .ai-settings-toggle label { text-transform: none !important; font-size: 13px !important; opacity: 1 !important; }
    .ai-prompt-settings { border-top: 1px solid var(--border, #e5e5e5); padding-top: 14px; }
    .ai-prompt-settings h3 { margin: 0 0 10px; font-size: 13px; }
    .ai-prompt-editors { display: grid; gap: 10px; }
    .ai-prompt-editor {
      display: grid; gap: 7px; padding: 10px;
      border: 1px solid var(--border, #e5e5e5); border-radius: 7px;
    }
    .ai-prompt-editor-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .ai-prompt-editor-heading label { font-size: 13px; font-weight: 600; }
    .ai-prompt-editor-heading select {
      min-width: 132px; padding: 6px 9px; font-size: 12px;
      background: var(--btn-bg, #f5f5f7); color: var(--fg, #1d1d1f);
      border: 1px solid var(--border, #e5e5e5); border-radius: 7px;
    }
    .ai-prompt-editor textarea {
      box-sizing: border-box; width: 100%; min-height: 112px; resize: vertical;
      padding: 8px 10px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--btn-bg, #f5f5f7); color: var(--fg, #1d1d1f);
      border: 1px solid var(--border, #e5e5e5); border-radius: 7px; outline: none;
    }
    .ai-prompt-editor textarea:focus { border-color: #a855f7; }
    .ai-prompt-editor textarea:disabled { opacity: 0.7; cursor: default; }
    .ai-prompt-editor > button { justify-self: start; }
    .ai-test-result {
      padding: 9px 12px; border-radius: 7px; font-size: 12px; font-weight: 500;
    }
    .ai-test-loading { background: rgba(168,85,247,0.1); color: #a855f7; }
    .ai-test-success { background: rgba(52,199,89,0.12); color: #1a7f37; }
    .ai-test-error { background: rgba(255,59,48,0.1); color: #d03030; }
    .ai-settings-footer {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px; border-top: 1px solid var(--border, #e5e5e5);
    }
    .ai-btn-primary {
      padding: 7px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
      background: #a855f7; color: #fff; border: none; border-radius: 7px;
    }
    .ai-btn-primary:hover { background: #9333ea; }
    .ai-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .ai-btn-secondary {
      padding: 7px 14px; font-size: 13px; cursor: pointer;
      background: var(--btn-bg, #f5f5f7); color: var(--fg, #1d1d1f);
      border: 1px solid var(--border, #e5e5e5); border-radius: 7px;
    }
    .ai-btn-secondary:hover { background: var(--btn-hover, #ebebeb); }
    .ai-btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
    @media (prefers-color-scheme: dark) {
      .settings-modal { background: #1e1e1e; border-color: #3e3e3e; }
      .settings-header, .settings-tabs { border-color: #3e3e3e; }
      .settings-tabs { background: #252525; }
      .settings-tabs button.active { background: #3a3a3a; }
      .settings-field select { background: #2d2d2d; border-color: #3e3e3e; color: #d4d4d4; }
      .ai-settings-field select,
      .ai-settings-field input,
      .ai-prompt-editor select,
      .ai-prompt-editor textarea { background: #2d2d2d; border-color: #3e3e3e; color: #d4d4d4; }
      .ai-apikey-row button { background: #2d2d2d; border-color: #3e3e3e; color: #d4d4d4; }
      .ai-settings-footer { border-color: #3e3e3e; }
      .ai-btn-secondary { background: #2d2d2d; border-color: #3e3e3e; color: #d4d4d4; }
      .ai-btn-secondary:hover { background: #3a3a3a; }
      .ai-test-success { background: rgba(52,199,89,0.15); color: #4caf72; }
      .ai-test-error { background: rgba(255,80,80,0.15); color: #ff6b6b; }
    }
    @media (max-width: 560px) {
      .settings-modal { min-height: 0; height: 86vh; }
      .settings-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .settings-tabs { display: flex; gap: 4px; border-right: 0; border-bottom: 1px solid var(--border, #e5e5e5); }
      .settings-tabs button { width: auto; }
      .ai-model-row { flex-direction: column; }
      .ai-prompt-editor-heading { align-items: stretch; flex-direction: column; }
      .ai-prompt-editor-heading select { width: 100%; }
      .ai-model-row select { max-width: none; }
    }

    /* ─── AI Enhance Modal ───────────────────────────────── */
    .ai-enhance-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1100;
      backdrop-filter: blur(4px);
    }
    .ai-enhance-modal {
      background: var(--bg, #fff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      width: 86vw; max-width: 1100px;
      height: 72vh; max-height: 680px;
      box-shadow: 0 24px 72px rgba(0,0,0,0.28);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .ai-enhance-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px 11px;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }
    .ai-enhance-title { font-size: 14px; font-weight: 600; }
    .ai-enhance-header-actions { display: flex; align-items: center; gap: 12px; }
    .ai-enhance-status {
      font-size: 12px; font-weight: 500;
      padding: 3px 8px; border-radius: 20px;
    }
    .ai-status-generating { background: rgba(168,85,247,0.12); color: #a855f7; }
    .ai-status-done { background: rgba(52,199,89,0.12); color: #1a7f37; }
    .ai-status-error { background: rgba(255,59,48,0.1); color: #d03030; }
    .ai-enhance-cursor {
      animation: ai-blink 1s step-end infinite;
      color: #a855f7;
    }
    @keyframes ai-blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .ai-enhance-body {
      flex: 1; display: flex; overflow: hidden;
    }
    .ai-diff-panel {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    .ai-diff-label {
      padding: 6px 14px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.06em;
      background: var(--btn-bg, #f5f5f7);
      border-bottom: 1px solid var(--border, #e5e5e5);
      color: var(--fg, #1d1d1f); opacity: 0.6;
      display: flex; align-items: center; gap: 6px;
    }
    .ai-diff-content {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 14px 16px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 13px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
      color: var(--fg, #1d1d1f);
    }
    .ai-diff-enhanced { color: #1a7f37; }
    .ai-diff-divider {
      width: 1px;
      background: var(--border, #e5e5e5);
      flex-shrink: 0;
    }
    .ai-enhance-footer {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 16px;
      border-top: 1px solid var(--border, #e5e5e5);
    }
    @media (prefers-color-scheme: dark) {
      .ai-enhance-modal { background: #1e1e1e; border-color: #3e3e3e; }
      .ai-enhance-header, .ai-diff-label { border-color: #3e3e3e; }
      .ai-diff-label { background: #252525; }
      .ai-diff-divider { background: #3e3e3e; }
      .ai-enhance-footer { border-color: #3e3e3e; }
      .ai-diff-enhanced { color: #4caf72; }
      .ai-status-done { background: rgba(52,199,89,0.15); color: #4caf72; }
      .ai-status-error { background: rgba(255,80,80,0.15); color: #ff6b6b; }
    }

    /* File Completion Preview */
    .file-completion-preview {
      padding: 8px;
    }
    
    .file-preview-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    
    .file-preview-icon {
      font-size: 16px;
    }
    
    .file-preview-name {
      font-weight: 600;
      font-size: 13px;
    }
    
    .file-preview-path {
      font-size: 11px;
      opacity: 0.7;
      font-family: monospace;
    }
    
    /* File Picker Styles */
    .file-picker-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.15s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .file-picker {
      background: var(--bg, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      width: 480px;
      max-height: 400px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.2s ease;
    }
    
    @keyframes slideIn {
      from { 
        opacity: 0;
        transform: translateY(-20px);
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .file-picker-header {
      display: flex;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
      gap: 8px;
    }
    
    .file-picker-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 6px;
      background: var(--bg, #ffffff);
      color: var(--fg, #1d1d1f);
      font-size: 14px;
      outline: none;
    }
    
    .file-picker-input:focus {
      border-color: #0066ff;
    }
    
    .file-picker-scan {
      padding: 8px 12px;
      background: var(--btn-bg, #f5f5f7);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.15s;
    }
    
    .file-picker-workspace {
      padding: 8px 12px;
      font-size: 12px;
      background: rgba(0, 102, 255, 0.08);
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .file-picker-workspace-empty {
      background: rgba(128, 128, 128, 0.08);
      color: #888;
      font-weight: normal;
    }
    
    @media (prefers-color-scheme: dark) {
      .file-picker-workspace {
        background: rgba(100, 181, 246, 0.15);
      }
      
      .file-picker-workspace-empty {
        background: rgba(128, 128, 128, 0.15);
        color: #888;
      }
    }
    
    .file-picker-scan:hover {
      background: var(--btn-hover, #e8e8ed);
    }
    
    .file-picker-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
      max-height: 280px;
    }
    
    .file-picker-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      cursor: pointer;
      gap: 8px;
      transition: background 0.1s;
      border-left: 3px solid transparent;
    }
    
    .file-picker-item:hover,
    .file-picker-item.selected {
      background: var(--btn-hover, #f0f0f0);
      border-left-color: #0066ff;
    }
    
    .file-picker-icon {
      font-size: 16px;
      flex-shrink: 0;
    }
    
    .file-picker-name {
      font-weight: 500;
      font-size: 13px;
      flex-shrink: 0;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .file-picker-path {
      font-size: 12px;
      opacity: 0.6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }
    
    .file-picker-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 8px 12px;
      border-top: 1px solid var(--border, #e5e5e5);
      font-size: 11px;
      opacity: 0.6;
    }
    
    .file-picker-hint {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .file-picker-empty {
      text-align: center;
      padding: 40px 20px;
      opacity: 0.6;
    }
    
    .file-picker-empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    .file-picker-empty-hint {
      font-size: 12px;
      margin-top: 8px;
      color: #0066ff;
    }
    
    /* Dark theme for file picker */
    @media (prefers-color-scheme: dark) {
      .file-picker {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
      }
      
      .file-picker-header {
        border-color: var(--border, #3e3e3e);
      }
      
      .file-picker-input {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
        color: var(--fg, #d4d4d4);
      }
      
      .file-picker-footer {
        border-color: var(--border, #3e3e3e);
      }
      
      .file-picker-item:hover,
      .file-picker-item.selected {
        background: var(--btn-hover, #3a3a3a);
        border-left-color: #64b5f6;
      }
      
      .file-picker-empty-hint {
        color: #64b5f6;
      }
    }
    
    /* Paste hint */
    #paste-hint {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 50;
    }
    #paste-hint.show {
      opacity: 0.8;
      transform: translateY(0);
    }

    /* Light theme */
    :root {
      --bg: #ffffff;
      --fg: #1d1d1f;
      --border: #e5e5e5;
      --btn-bg: #f5f5f7;
      --btn-fg: #1d1d1f;
      --btn-hover: #e8e8ed;
    }
    body { background: var(--bg); color: var(--fg); }

    /* Dark theme */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --fg: #d4d4d4;
        --border: #3e3e3e;
        --btn-bg: #2d2d2d;
        --btn-fg: #d4d4d4;
        --btn-hover: #3a3a3a;
        --history-bg: #252525;
        --history-hover: #2d2d2d;
      }
    }

    /* History panel */
    #history-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100%;
      background: var(--history-bg, #f8f8f8);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }
    #history-panel.open {
      transform: translateX(0);
    }
    #history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }
    #history-header h3 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }
    #history-header button {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--fg);
      opacity: 0.6;
      -webkit-app-region: no-drag;
    }
    #history-header button:hover {
      opacity: 1;
    }
    #history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    #history-search {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    #history-search input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      outline: none;
    }
    #history-search input:focus {
      border-color: #0066ff;
    }
    #history-filters {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    #history-filters button {
      flex: 1;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;
      transition: background 0.15s;
    }
    #history-filters button:hover {
      background: var(--btn-hover);
    }
    #history-filters button.active {
      background: #0066ff;
      color: #fff;
      border-color: #0055dd;
    }
    .history-empty {
      text-align: center;
      padding: 40px 20px;
      opacity: 0.5;
      font-size: 13px;
    }
    .history-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      position: relative;
      transition: background 0.15s;
    }
    .history-item:hover {
      background: var(--history-hover, #f0f0f0);
    }
    .history-item.favorited {
      border-left: 3px solid #ff9500;
    }
    .history-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      padding-right: 24px;
    }
    .history-item-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--fg);
      outline: none;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 2px 4px;
      margin-left: -4px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-item-name:hover {
      border-color: var(--border);
      background: var(--btn-bg);
    }
    .history-item-name:focus {
      border-color: #0066ff;
      background: var(--bg);
    }
    .history-item-name.placeholder {
      opacity: 0.6;
      font-style: italic;
    }
    .history-item-favorite {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #999;
      padding: 2px 4px;
      margin-left: 4px;
      transition: color 0.15s;
    }
    .history-item-favorite:hover {
      color: #ff9500;
    }
    .history-item.favorited .history-item-favorite {
      color: #ff9500;
    }
    .history-item-preview {
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 4px;
      word-break: break-word;
      padding-right: 24px;
    }
    .history-item-time {
      font-size: 11px;
      opacity: 0.5;
    }
    .history-item-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .history-item:hover .history-item-delete {
      opacity: 0.6;
    }
    .history-item-delete:hover {
      opacity: 1 !important;
      background: rgba(255, 0, 0, 0.1);
      color: #ff4444;
    }
    
    /* Modal Dialog */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal.show {
      display: flex;
    }
    .modal.full-screen {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
    }
    .modal.full-screen .manager-panel {
      width: 100%;
      height: 100%;
    }
    .modal-content {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .modal-content h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    .modal-content p {
      margin: 0 0 16px 0;
      font-size: 13px;
      opacity: 0.6;
    }
    .modal-preview {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-actions button {

      font-size: 13px;
    }
    .modal-select {

    .modal-select select {

      color: var(--fg);

    /* Prompt Memory Scanner */
    .prompt-memory-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
      z-index: 210;
    }
    .prompt-memory-modal {
      position: fixed;
      top: 48px;
      left: 24px;
      right: 24px;
      bottom: 32px;
      max-width: 900px;
      margin: 0 auto;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
      z-index: 211;
    }
    .prompt-memory-header,
    .prompt-memory-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .prompt-memory-header h3 {
      font-size: 14px;
      margin: 0;
    }
    .prompt-memory-close {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;
    }
    .prompt-memory-footer {
      border-bottom: 0;
      border-top: 1px solid var(--border);
    }
    .prompt-memory-footer-actions {
      display: flex;
      gap: 8px;
    }
    .prompt-memory-body {
      flex: 1;
      padding: 12px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .prompt-memory-controls,
    .prompt-memory-result-tools {
      display: flex;
      gap: 8px;
    }
    .prompt-memory-controls select,
    .prompt-memory-result-tools input,
    .prompt-memory-result-tools select {
      min-height: 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      padding: 5px 8px;
    }
    .prompt-memory-directory,
    .prompt-memory-result {
      display: grid;
      grid-template-columns: auto 96px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
      background: var(--btn-bg);
      font-size: 12px;
    }
    .prompt-memory-result {
      grid-template-columns: auto minmax(0, 1fr) auto;
      cursor: default;
    }
    .prompt-memory-path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.8;
    }
    .prompt-memory-badge {
      font-size: 11px;
      opacity: 0.7;
      white-space: nowrap;
    }
    .prompt-memory-progress-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      opacity: 0.85;
    }
    .prompt-memory-progress-row span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prompt-memory-error {
      color: #d73a49;
      font-size: 12px;
      padding: 4px 0;
    }
    .prompt-memory-result-content {
      white-space: pre-wrap;
      word-break: break-word;
      overflow: hidden;
      max-height: 4.6em;
      cursor: pointer;
    }
    .prompt-memory-result.expanded .prompt-memory-result-content {
      max-height: none;
    }
    .prompt-memory-empty {
      padding: 12px;
      font-size: 13px;
      opacity: 0.6;
      text-align: center;
    }
    .prompt-memory-footer button,
    .prompt-memory-controls button {
      padding: 6px 12px;

      border-radius: 6px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;

    .prompt-memory-footer button:disabled {

    .modal-checkbox {

    .checkbox-label {

      cursor: pointer;
