<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt Editor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      user-select: none;
      -webkit-app-region: drag;
    }
    #toolbar .actions {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    #toolbar .title {
      font-size: 13px;
      font-weight: 600;
      opacity: 0.7;
    }
    #toolbar button {
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      min-height: 28px;
    }
    #toolbar button:hover { 
      background: var(--btn-hover); 
      border-color: #0066ff;
    }
    #toolbar button.icon-btn-toolbar {
      padding: 6px;
      font-size: 16px;
    }
    #toolbar button.icon-btn-toolbar svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    #toolbar button.primary {
      background: #0066ff;
      color: #fff;
      border-color: #0055dd;
    }
    #toolbar button.primary:hover { background: #0055dd; }
    #toolbar button.secondary {
      background: var(--btn-bg);
      color: var(--btn-fg);
    }
    #toolbar button.secondary:hover { background: var(--btn-hover); }
    #toolbar button.accent {
      background: #34c759;
      color: #fff;
      border-color: #30b350;
    }
    #toolbar button.accent:hover { background: #30b350; }
    #toolbar select {
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }
    #toolbar select:focus {
      border-color: #0066ff;
    }
    .toolbar-separator {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
    }
    #editor-container { flex: 1; overflow: auto; }
    .cm-editor { height: 100%; }
    .cm-editor .cm-scroller { overflow: auto; }
    .cm-editor .cm-content { padding: 12px 16px; }
    
    /* Image styles in editor */
    .cm-editor img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 4px 0;
    }
    
    /* File Reference Styles */
    .cm-file-reference {
      background: rgba(0, 102, 255, 0.12);
      border-radius: 3px;
      padding: 1px 4px;
      color: #0066ff;
      cursor: pointer;
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid rgba(0, 102, 255, 0.3);
      transition: background 0.15s, border-color 0.15s;
    }
    
    .cm-file-reference:hover,
    .cm-file-reference-hover {
      background: rgba(0, 102, 255, 0.2);
      border-bottom-color: rgba(0, 102, 255, 0.5);
    }
    
    .cm-file-reference-invalid {
      background: rgba(255, 59, 48, 0.12);
      border-radius: 3px;
      padding: 1px 4px;
      color: #ff3b30;
      cursor: pointer;
      font-weight: 500;
      text-decoration: line-through;
      border-bottom: 1px solid rgba(255, 59, 48, 0.3);
    }
    
    .cm-file-reference-invalid:hover {
      background: rgba(255, 59, 48, 0.2);
    }
    
    /* Dark theme adjustments */
    @media (prefers-color-scheme: dark) {
      .cm-file-reference {
        background: rgba(0, 122, 255, 0.2);
        color: #64b5f6;
        border-bottom-color: rgba(100, 181, 246, 0.4);
      }
      
      .cm-file-reference:hover,
      .cm-file-reference-hover {
        background: rgba(0, 122, 255, 0.3);
      }
      
      .cm-file-reference-invalid {
        background: rgba(255, 82, 82, 0.2);
        color: #ff5252;
        border-bottom-color: rgba(255, 82, 82, 0.4);
      }
    }
    
    /* Workspace Bar */
    #workspace-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      background: var(--btn-bg, #f5f5f7);
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-size: 12px;
      gap: 8px;
    }
    
    #workspace-info {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    #workspace-info.has-workspace {
      opacity: 1;
      font-weight: 500;
      color: #0066ff;
    }

    /* Workspace History Dropdown */
    #workspace-history-select {
      background: var(--bg, #fff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--fg, #1d1d1f);
      cursor: pointer;
      outline: none;
      max-width: 150px;
      transition: border-color 0.15s;
    }

    #workspace-history-select:hover,
    #workspace-history-select:focus {
      border-color: #0066ff;
    }

    #workspace-history-select option {
      font-size: 12px;
      padding: 4px;
    }
    
    #btn-switch-workspace,
    #btn-rescan-workspace,
    #btn-clear-workspace {
      padding: 4px;
      font-size: 12px;
      background: var(--bg, #fff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s, border-color 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      min-height: 24px;
    }

    #btn-switch-workspace:hover,
    #btn-rescan-workspace:hover,
    #btn-clear-workspace:hover {
      opacity: 1;
      border-color: #0066ff;
    }
    
    @media (prefers-color-scheme: dark) {
      #workspace-bar {
        background: var(--btn-bg, #2d2d2d);
        border-color: var(--border, #3e3e3e);
      }
      
      #workspace-info.has-workspace {
        color: #64b5f6;
      }

      #workspace-history-select {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
        color: var(--fg, #d4d4d4);
      }
      
      #btn-switch-workspace,
      #btn-rescan-workspace,
      #btn-clear-workspace {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
        color: var(--fg, #d4d4d4);
      }
    }
    
    /* File Completion Preview */
    .file-completion-preview {
      padding: 8px;
    }
    
    .file-preview-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    
    .file-preview-icon {
      font-size: 16px;
    }
    
    .file-preview-name {
      font-weight: 600;
      font-size: 13px;
    }
    
    .file-preview-path {
      font-size: 11px;
      opacity: 0.7;
      font-family: monospace;
    }
    
    /* File Picker Styles */
    .file-picker-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.15s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .file-picker {
      background: var(--bg, #ffffff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 12px;
      width: 480px;
      max-height: 400px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.2s ease;
    }
    
    @keyframes slideIn {
      from { 
        opacity: 0;
        transform: translateY(-20px);
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .file-picker-header {
      display: flex;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--border, #e5e5e5);
      gap: 8px;
    }
    
    .file-picker-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 6px;
      background: var(--bg, #ffffff);
      color: var(--fg, #1d1d1f);
      font-size: 14px;
      outline: none;
    }
    
    .file-picker-input:focus {
      border-color: #0066ff;
    }
    
    .file-picker-scan {
      padding: 8px 12px;
      background: var(--btn-bg, #f5f5f7);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.15s;
    }
    
    .file-picker-workspace {
      padding: 8px 12px;
      font-size: 12px;
      background: rgba(0, 102, 255, 0.08);
      border-bottom: 1px solid var(--border, #e5e5e5);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .file-picker-workspace-empty {
      background: rgba(128, 128, 128, 0.08);
      color: #888;
      font-weight: normal;
    }
    
    @media (prefers-color-scheme: dark) {
      .file-picker-workspace {
        background: rgba(100, 181, 246, 0.15);
      }
      
      .file-picker-workspace-empty {
        background: rgba(128, 128, 128, 0.15);
        color: #888;
      }
    }
    
    .file-picker-scan:hover {
      background: var(--btn-hover, #e8e8ed);
    }
    
    .file-picker-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
      max-height: 280px;
    }
    
    .file-picker-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      cursor: pointer;
      gap: 8px;
      transition: background 0.1s;
      border-left: 3px solid transparent;
    }
    
    .file-picker-item:hover,
    .file-picker-item.selected {
      background: var(--btn-hover, #f0f0f0);
      border-left-color: #0066ff;
    }
    
    .file-picker-icon {
      font-size: 16px;
      flex-shrink: 0;
    }
    
    .file-picker-name {
      font-weight: 500;
      font-size: 13px;
      flex-shrink: 0;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .file-picker-path {
      font-size: 12px;
      opacity: 0.6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: monospace;
    }
    
    .file-picker-footer {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 8px 12px;
      border-top: 1px solid var(--border, #e5e5e5);
      font-size: 11px;
      opacity: 0.6;
    }
    
    .file-picker-hint {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .file-picker-empty {
      text-align: center;
      padding: 40px 20px;
      opacity: 0.6;
    }
    
    .file-picker-empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    .file-picker-empty-hint {
      font-size: 12px;
      margin-top: 8px;
      color: #0066ff;
    }
    
    /* Dark theme for file picker */
    @media (prefers-color-scheme: dark) {
      .file-picker {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
      }
      
      .file-picker-header {
        border-color: var(--border, #3e3e3e);
      }
      
      .file-picker-input {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
        color: var(--fg, #d4d4d4);
      }
      
      .file-picker-footer {
        border-color: var(--border, #3e3e3e);
      }
      
      .file-picker-item:hover,
      .file-picker-item.selected {
        background: var(--btn-hover, #3a3a3a);
        border-left-color: #64b5f6;
      }
      
      .file-picker-empty-hint {
        color: #64b5f6;
      }
    }
    
    /* Paste hint */
    #paste-hint {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 50;
    }
    #paste-hint.show {
      opacity: 0.8;
      transform: translateY(0);
    }

    /* Light theme */
    :root {
      --bg: #ffffff;
      --fg: #1d1d1f;
      --border: #e5e5e5;
      --btn-bg: #f5f5f7;
      --btn-fg: #1d1d1f;
      --btn-hover: #e8e8ed;
    }
    body { background: var(--bg); color: var(--fg); }

    /* Dark theme */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --fg: #d4d4d4;
        --border: #3e3e3e;
        --btn-bg: #2d2d2d;
        --btn-fg: #d4d4d4;
        --btn-hover: #3a3a3a;
        --history-bg: #252525;
        --history-hover: #2d2d2d;
      }
    }

    /* History panel */
    #history-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100%;
      background: var(--history-bg, #f8f8f8);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }
    #history-panel.open {
      transform: translateX(0);
    }
    #history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }
    #history-header h3 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }
    #history-header button {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--fg);
      opacity: 0.6;
      -webkit-app-region: no-drag;
    }
    #history-header button:hover {
      opacity: 1;
    }
    #history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    #history-search {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    #history-search input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      outline: none;
    }
    #history-search input:focus {
      border-color: #0066ff;
    }
    #history-filters {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    #history-filters button {
      flex: 1;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--btn-bg);
      color: var(--btn-fg);
      cursor: pointer;
      transition: background 0.15s;
    }
    #history-filters button:hover {
      background: var(--btn-hover);
    }
    #history-filters button.active {
      background: #0066ff;
      color: #fff;
      border-color: #0055dd;
    }
    .history-empty {
      text-align: center;
      padding: 40px 20px;
      opacity: 0.5;
      font-size: 13px;
    }
    .history-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      position: relative;
      transition: background 0.15s;
    }
    .history-item:hover {
      background: var(--history-hover, #f0f0f0);
    }
    .history-item.favorited {
      border-left: 3px solid #ff9500;
    }
    .history-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      padding-right: 24px;
    }
    .history-item-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--fg);
      outline: none;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 2px 4px;
      margin-left: -4px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-item-name:hover {
      border-color: var(--border);
      background: var(--btn-bg);
    }
    .history-item-name:focus {
      border-color: #0066ff;
      background: var(--bg);
    }
    .history-item-name.placeholder {
      opacity: 0.6;
      font-style: italic;
    }
    .history-item-favorite {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #999;
      padding: 2px 4px;
      margin-left: 4px;
      transition: color 0.15s;
    }
    .history-item-favorite:hover {
      color: #ff9500;
    }
    .history-item.favorited .history-item-favorite {
      color: #ff9500;
    }
    .history-item-preview {
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 4px;
      word-break: break-word;
      padding-right: 24px;
    }
    .history-item-time {
      font-size: 11px;
      opacity: 0.5;
    }
    .history-item-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .history-item:hover .history-item-delete {
      opacity: 0.6;
    }
    .history-item-delete:hover {
      opacity: 1 !important;
      background: rgba(255, 0, 0, 0.1);
      color: #ff4444;
    }
    
    /* Modal Dialog */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal.show {
      display: flex;
    }
    .modal.full-screen {
      padding: 0;
      align-items: stretch;
      justify-content: stretch;
    }
    .modal.full-screen .manager-panel {
      width: 100%;
      height: 100%;
    }
    .modal-content {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .modal-content h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    .modal-content p {
      margin: 0 0 16px 0;
      font-size: 13px;
      opacity: 0.6;
    }
    .modal-preview {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-actions button {
      padding: 6px 16px;
      font-size: 13px;
    }
    .modal-select {
      margin-bottom: 16px;
    }
    .modal-select label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      opacity: 0.8;
    }
    .modal-select select {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      outline: none;
    }
    .modal-select select:focus {
      border-color: #0066ff;
    }
    .modal-checkbox {
      margin-bottom: 16px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    
    /* Side Panel (Template & History) */
    .side-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 320px;
      height: 100%;
      background: var(--history-bg, #f8f8f8);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform 0.2s ease;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }
    .side-panel.open {
      transform: translateX(0);
    }
    .side-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;

      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 300;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Template Editor Container */
    .template-editor-container {
      border: 1px solid var(--border);
      border-radius: 6px;
      min-height: 200px;
      overflow: hidden;
    }
    .template-editor-container .cm-editor {

    /* Template Placeholder Styles */
    .cm-template-placeholder {
      background: rgba(0, 102, 255, 0.12);

      padding: 0 4px;
      color: #0066ff;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .cm-template-placeholder:hover {
      background: rgba(0, 102, 255, 0.2);
    }
    .cm-template-placeholder.defined {
      background: rgba(52, 199, 89, 0.15);
      border-color: rgba(52, 199, 89, 0.4);
      color: #34c759;
    }
    .cm-template-placeholder.defined:hover {
      background: rgba(52, 199, 89, 0.25);
    }
    .cm-template-placeholder.undefined {
      background: rgba(255, 59, 48, 0.12);
      border-color: rgba(255, 59, 48, 0.3);
      color: #ff3b30;
    }
    .cm-template-placeholder.undefined:hover {
      background: rgba(255, 59, 48, 0.2);
    }

    /* Dark theme for template placeholders */
    @media (prefers-color-scheme: dark) {
      .cm-template-placeholder {
        background: rgba(100, 181, 246, 0.15);
        border-color: rgba(100, 181, 246, 0.3);
        color: #64b5f6;
      }
      .cm-template-placeholder:hover {
        background: rgba(100, 181, 246, 0.25);
      }
      .cm-template-placeholder.defined {
        background: rgba(76, 175, 80, 0.2);
        border-color: rgba(76, 175, 80, 0.4);
        color: #81c784;
      }
      .cm-template-placeholder.defined:hover {
        background: rgba(76, 175, 80, 0.3);
      }
      .cm-template-placeholder.undefined {
        background: rgba(255, 82, 82, 0.15);
        border-color: rgba(255, 82, 82, 0.3);
        color: #ff5252;
      }
      .cm-template-placeholder.undefined:hover {
        background: rgba(255, 82, 82, 0.25);
      }

    /* Autocomplete for placeholders */
    .cm-tooltip {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    .cm-tooltip-autocomplete ul li {
      padding: 6px 12px;
      font-size: 13px;
    }
    .cm-tooltip-autocomplete ul li[aria-selected="true"] {
      background: rgba(0, 102, 255, 0.1);

    @media (prefers-color-scheme: dark) {
      .cm-tooltip {
        background: var(--bg, #1e1e1e);

      }

    /* Variable Preview in Template Editor */
    .variables-preview {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .variable-preview-item {
      display: flex;
      align-items: center;
      gap: 8px;

    .variable-preview-item .var-icon {

    .variable-preview-item .var-label {

    .variable-preview-item .var-badge {

      }
      .variable-preview-item .var-badge {

    /* Inline Template Editor Styles */
    .inline-template-editor {
      font-size: 14px;
      line-height: 1.8;
    }
    .inline-template-content {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 350px;
      overflow-y: auto;
      line-height: 2;
    }
    .inline-control {
      display: inline-block;
      vertical-align: middle;
      margin: 2px 4px;
    }
    .inline-control input,
    .inline-control select,
    .inline-control textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--fg);
      min-width: 100px;
      vertical-align: middle;
      transition: all 0.15s;
    }
    .inline-control input:focus,
    .inline-control select:focus,
    .inline-control textarea:focus {
      outline: none;
      border-color: #0066ff;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
    }
    .inline-control.required input,
    .inline-control.required select,
    .inline-control.required textarea {
      border-color: #ff3b30;
      background: rgba(255, 59, 48, 0.05);
    }
    .inline-control.required input:focus,
    .inline-control.required select:focus,
    .inline-control.required textarea:focus {
      border-color: #ff3b30;
      box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.15);

    .inline-control textarea {

    }
    .inline-control select {
      cursor: pointer;

    }
    .inline-control .multiselect-wrapper {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      vertical-align: middle;
      max-width: 350px;
      padding: 4px 0;
    }
    .inline-control .checkbox-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .inline-control .checkbox-option:hover {
      background: var(--btn-hover);
      border-color: #0066ff;
    }
    .inline-control .checkbox-option input[type="checkbox"] {
      margin: 0;
      min-width: auto;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }
    /* Inline checkbox */
    .inline-control .inline-checkbox-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .inline-control .inline-checkbox-option:hover {
      background: var(--btn-hover);
      border-color: #0066ff;
    }
    .inline-control .inline-checkbox-option input[type="checkbox"] {
      margin: 0;
      min-width: auto;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    /* Inline radio */
    .inline-control .radio-wrapper {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      vertical-align: middle;
      max-width: 350px;
      padding: 4px 0;
    }
    .inline-control .radio-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .inline-control .radio-option:hover {
      background: var(--btn-hover);
      border-color: #0066ff;
    }
    .inline-control .radio-option input[type="radio"] {
      margin: 0;
      min-width: auto;
      cursor: pointer;
      width: 14px;
      height: 14px;
    }
    .inline-template-preview-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .inline-template-preview-section label {
      font-size: 12px;
      font-weight: 600;
      opacity: 0.7;
      margin-bottom: 8px;
      display: block;
    }
    .inline-template-preview {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      color: var(--fg);
      opacity: 0.9;
    }
    @media (prefers-color-scheme: dark) {
      .inline-control input,
      .inline-control select,
      .inline-control textarea {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
      }
      .inline-control .checkbox-option {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
      }
      .inline-control input:focus,
      .inline-control select:focus,
      .inline-control textarea:focus {
        border-color: #64b5f6;
        box-shadow: 0 0 0 3px rgba(100, 181, 246, 0.2);
      }
      .inline-control .checkbox-option:hover {
        border-color: #64b5f6;
      }
    }

    /* Required placeholder style */
    .cm-template-placeholder.required {
      border-style: dashed;
      border-width: 2px;
    }

    /* Type-specific placeholder styles */
    .cm-template-placeholder.type-textarea {
      background: rgba(156, 39, 176, 0.12);
      border-color: rgba(156, 39, 176, 0.3);
      color: #9c27b0;
    }
    .cm-template-placeholder.type-select,
    .cm-template-placeholder.type-multiselect {
      background: rgba(255, 152, 0, 0.12);
      border-color: rgba(255, 152, 0, 0.3);
      color: #ff9800;
    }
    .cm-template-placeholder.type-number {
      background: rgba(0, 150, 136, 0.12);
      border-color: rgba(0, 150, 136, 0.3);
      color: #009688;
    }
    .cm-template-placeholder.type-checkbox {
      background: rgba(63, 81, 181, 0.12);
      border-color: rgba(63, 81, 181, 0.3);
      color: #3f51b5;
    }
    .cm-template-placeholder.type-radio {
      background: rgba(233, 30, 99, 0.12);
      border-color: rgba(233, 30, 99, 0.3);
      color: #e91e63;
    }
    @media (prefers-color-scheme: dark) {
      .cm-template-placeholder.type-textarea {
        background: rgba(186, 104, 200, 0.15);
        border-color: rgba(186, 104, 200, 0.4);
        color: #ba68c8;
      }
      .cm-template-placeholder.type-select,
      .cm-template-placeholder.type-multiselect {
        background: rgba(255, 183, 77, 0.15);
        border-color: rgba(255, 183, 77, 0.4);
        color: #ffb74d;
      }
      .cm-template-placeholder.type-number {
        background: rgba(77, 182, 172, 0.15);
        border-color: rgba(77, 182, 172, 0.4);
        color: #4db6ac;
      }
      .cm-template-placeholder.type-checkbox {
        background: rgba(121, 134, 203, 0.15);
        border-color: rgba(121, 134, 203, 0.4);
        color: #7986cb;
      }
      .cm-template-placeholder.type-radio {
        background: rgba(240, 98, 146, 0.15);
        border-color: rgba(240, 98, 146, 0.4);
        color: #f06292;
      }
    }

    /* Template Edit Mode Styles */
    .template-mode-active .cm-editor {
      background: rgba(0, 102, 255, 0.02);
    }
    .template-mode-control-wrapper {
      display: inline-block;
      vertical-align: middle;
      margin: 0 2px;
    }
    .template-mode-input,
    .template-mode-select,
    .template-mode-textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 13px;
      font-family: inherit;
      color: var(--fg);
      min-width: 60px;
      vertical-align: middle;
      transition: all 0.15s;
    }
    .template-mode-input:focus,
    .template-mode-select:focus,
    .template-mode-textarea:focus {
      outline: none;
      border-color: #0066ff;
      box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.1);
    }
    .template-mode-input.required,
    .template-mode-select.required,
    .template-mode-textarea.required {
      border-color: #ff3b30;
      background: rgba(255, 59, 48, 0.05);
    }
    .template-mode-input.required:focus,
    .template-mode-select.required:focus,
    .template-mode-textarea.required:focus {
      border-color: #ff3b30;
      box-shadow: 0 0 0 2px rgba(255, 59, 48, 0.1);
    }
    .template-mode-textarea {
      min-width: 200px;
      vertical-align: top;
      display: inline-block;
    }
    .template-mode-select {
      cursor: pointer;
    }
    .template-mode-multiselect {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 4px;
      vertical-align: middle;
      max-width: 300px;
    }
    .template-mode-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .template-mode-checkbox:hover {
      background: var(--btn-hover);
      border-color: #0066ff;
    }
    .template-mode-checkbox input[type="checkbox"] {
      margin: 0;
      cursor: pointer;
    }
    .template-mode-number {
      width: 80px;
      text-align: right;
    }
    .template-mode-radio {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .template-mode-radio:hover {
      background: var(--btn-hover);
      border-color: #0066ff;
    }
    .template-mode-radio input[type="radio"] {
      margin: 0;
      cursor: pointer;
    }
    
    /* Template mode indicator */
    .template-mode-indicator {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #0066ff;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
      z-index: 100;
      display: none;
      animation: slideIn 0.2s ease;
    }
    .template-mode-indicator.show {
      display: block;
    }
    .template-mode-indicator button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .template-mode-indicator button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    @keyframes slideIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* Active template mode button */
    #btn-template-mode.active {
      background: #0066ff;
      color: white;
      border-color: #0055dd;
    }
    
    @media (prefers-color-scheme: dark) {
      .template-mode-input,
      .template-mode-select,
      .template-mode-textarea {
        background: var(--bg, #1e1e1e);
        border-color: var(--border, #3e3e3e);
      }
      .template-mode-input:focus,
      .template-mode-select:focus,
      .template-mode-textarea:focus {
        border-color: #64b5f6;
        box-shadow: 0 0 0 2px rgba(100, 181, 246, 0.2);
      }
      .template-mode-input.required:focus,
      .template-mode-select.required:focus,
      .template-mode-textarea.required:focus {
        border-color: #ff5252;
        box-shadow: 0 0 0 2px rgba(255, 82, 82, 0.2);

      }
      .template-mode-checkbox:hover {

        border-color: var(--border, #3e3e3e);
      }
      .template-mode-radio:hover {
        border-color: #64b5f6;
      }

    /* ==========================================================================
       Snippet Wheel - CS-style circular menu for prompt snippets
       
       Two modes:
       1. Inline overlay (.snippet-wheel-overlay) - shown inside main editor window
       2. Popup window (.snippet-wheel-popup) - shown as borderless native popup
       ========================================================================== */
    
    /* Inline overlay mode */
    .snippet-wheel-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }

    /* Popup window mode - transparent background */
    .snippet-wheel-popup {
      width: 100%;
      height: 100%;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .snippet-wheel-popup .snippet-wheel-container {
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    @media (prefers-color-scheme: light) {
      .snippet-wheel-popup .snippet-wheel-container {
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 
          0 25px 50px -12px rgba(0, 0, 0, 0.25),
          0 0 0 1px rgba(0, 0, 0, 0.05);
      }
    }

    .snippet-wheel-container {
      position: relative;
      width: 600px;
      height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Close button - hidden in popup mode */
    .snippet-wheel-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--fg);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      z-index: 10;
    }

    .snippet-wheel-close:hover {
      background: #ff3b30;
      color: #fff;
      border-color: #ff3b30;
    }

    .snippet-wheel-popup .snippet-wheel-close {
      display: none;
    }

    .snippet-wheel-breadcrumb {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--fg);
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      max-width: 90%;
      flex-wrap: wrap;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    @media (prefers-color-scheme: light) {
      .snippet-wheel-breadcrumb {
        background: rgba(0, 0, 0, 0.05);
        border-color: rgba(0, 0, 0, 0.1);
      }
    }

    .snippet-wheel-breadcrumb .bc-root,
    .snippet-wheel-breadcrumb .bc-item {
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s;
    }

    .snippet-wheel-breadcrumb .bc-root:hover,
    .snippet-wheel-breadcrumb .bc-item:hover {
      opacity: 1;
      color: #0066ff;
    }

    .snippet-wheel-breadcrumb .bc-separator {
      opacity: 0.4;
    }

    .snippet-wheel-breadcrumb .bc-current {
      font-weight: 600;
      opacity: 1;
    }

    .snippet-wheel {
      position: relative;
      width: 400px;
      height: 400px;
    }

    .snippet-wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      z-index: 5;
      box-shadow: 
        0 4px 20px rgba(0, 0, 0, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
    }

    .snippet-wheel-center .center-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .snippet-wheel-center .center-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .snippet-wheel-center .center-desc {
      font-size: 11px;
      color: var(--fg);
      opacity: 0.7;
      line-height: 1.3;
      max-height: 40px;
      overflow: hidden;
    }

    /* Wheel items with glass effect */
    .wheel-item {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80px;
      height: 80px;
      margin-left: -40px;
      margin-top: -40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: scaleIn 0.3s ease backwards;
      box-shadow: 
        0 4px 15px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
    }

    @media (prefers-color-scheme: dark) {
      .wheel-item {
        background: rgba(50, 50, 50, 0.9);
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow: 
          0 4px 15px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: translate(0, 0) scale(0.3);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .wheel-item:hover {
      transform: scale(1.2);
      border-color: #0066ff;
      box-shadow: 
        0 8px 30px rgba(0, 102, 255, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      z-index: 6;
    }

    .wheel-item.category {
      background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(245,245,247,0.95) 100%);
    }

    @media (prefers-color-scheme: dark) {
      .wheel-item.category {
        background: linear-gradient(135deg, rgba(60,60,60,0.95) 0%, rgba(45,45,45,0.95) 100%);
      }
    }

    .wheel-item.snippet {
      background: linear-gradient(135deg, #0066ff 0%, #0055dd 100%);
      color: #fff;
      border-color: rgba(0, 102, 255, 0.5);
    }

    .wheel-item.snippet:hover {
      background: linear-gradient(135deg, #0055dd 0%, #0044bb 100%);
      box-shadow: 
        0 8px 30px rgba(0, 102, 255, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .wheel-item.back {
      background: transparent;
      border: 2px dashed rgba(150, 150, 150, 0.4);
      opacity: 0.8;
    }

    @media (prefers-color-scheme: dark) {
      .wheel-item.back {
        border-color: rgba(255, 255, 255, 0.2);
      }
    }

    .wheel-item.back:hover {
      opacity: 1;
      border-color: #ff9500;
      background: rgba(255, 149, 0, 0.1);
    }

    .wheel-item-icon {
      font-size: 24px;
      margin-bottom: 2px;
    }

    .wheel-item-name {
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wheel-item-desc {
      font-size: 8px;
      opacity: 0.8;
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: none;
      margin-top: 2px;
    }

    .wheel-item:hover .wheel-item-desc {
      display: block;
    }

    .snippet-wheel-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--fg);
      opacity: 0.6;
      text-align: center;
    }

    /* Hidden in popup mode */
    .snippet-wheel-popup .snippet-wheel-hint {
      display: none;
    }

    /* Dark theme for snippet wheel */
    @media (prefers-color-scheme: dark) {
      .snippet-wheel-close:hover {
        background: #ff5252;
        border-color: #ff5252;
      }

      .snippet-wheel-breadcrumb .bc-root:hover,
      .snippet-wheel-breadcrumb .bc-item:hover {
        color: #64b5f6;
      }

      .wheel-item:hover {
        border-color: #64b5f6;
        box-shadow: 
          0 8px 30px rgba(100, 181, 246, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      .wheel-item.snippet {
        background: linear-gradient(135deg, #64b5f6 0%, #42a5f5 100%);
        border-color: rgba(100, 181, 246, 0.5);
      }

      .wheel-item.snippet:hover {
        background: linear-gradient(135deg, #42a5f5 0%, #2196f3 100%);
        box-shadow: 
          0 8px 30px rgba(100, 181, 246, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      .wheel-item.back:hover {
        border-color: #ffb74d;
      }
    }

    /* Responsive adjustments */
    @media (max-width: 700px) {
      .snippet-wheel-container {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }

      .snippet-wheel {
        width: 320px;
        height: 320px;
      }

      .snippet-wheel-center {
        width: 120px;
        height: 120px;
      }

      .wheel-item {
        width: 64px;
        height: 64px;
        margin-left: -32px;
        margin-top: -32px;
      }

      .wheel-item-icon {
        font-size: 20px;
      }

      .wheel-item-name {
        font-size: 9px;
        max-width: 56px;
      }
    }
  </style>
</head>
<body>
  <div id="history-panel">
    <div id="history-header">
      <h3>History</h3>
      <button id="btn-close-history" title="Close">×</button>
    </div>
    <div id="history-search">
      <input type="text" id="search-input" placeholder="Search prompts..." />
    </div>
    <div id="history-filters">
      <button id="filter-all" class="active">All</button>
      <button id="filter-favorites">★ Favorites</button>
    </div>
    <div id="history-list"></div>
  </div>
  <div id="toolbar">
    <span class="title">Prompt Editor</span>
    <div class="actions">
      <!-- Workspace controls -->
      <button id="btn-workspace" class="icon-btn-toolbar" title="Set Workspace (⌘⇧W)">
        <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V6h5.17l2 2H20v10z"/></svg>
      </button>
      <button id="btn-history" class="icon-btn-toolbar" title="History (⌘⇧H)">
        <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      </button>
      <button id="btn-snippets" class="icon-btn-toolbar" title="Prompt Snippets (⌘⇧S)">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      </button>
      <button id="btn-templates" class="icon-btn-toolbar" title="Templates (⌘⇧T)">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      </button>
      <button id="btn-template-mode" class="icon-btn-toolbar" title="Template Edit Mode (⌘⇧M)">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </button>
      <button id="btn-files" class="icon-btn-toolbar" title="File References @ (⌘⇧F)">
        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      </button>
      <div class="toolbar-separator"></div>
      <button id="btn-save" class="icon-btn-toolbar accent" title="Save to History (⌘S)">
        <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
      </button>
      <button id="btn-copy" class="icon-btn-toolbar" title="Copy to Clipboard (⌘⇧C)">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      </button>
      <button id="btn-clear" class="icon-btn-toolbar" title="Clear Editor">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <select id="target-select" title="Select running agent">
        <option value="default">🖥️ Default Terminal</option>
        <option value="copy">📋 Copy Only</option>
      </select>
      <button id="btn-refresh-agents" class="icon-btn-toolbar" title="Refresh running agents">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
      <button id="btn-send" class="icon-btn-toolbar primary" title="Send (⌘↵)">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
  <div id="workspace-bar">
    <span id="workspace-info">
      <span id="workspace-current">No workspace selected</span>
    </span>
    <select id="workspace-history-select" title="Recent Workspaces">
      <option value="">📋 Recent workspaces...</option>
    </select>
    <button id="btn-switch-workspace" title="Browse for workspace">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V6h5.17l2 2H20v10z"/></svg>
    </button>
    <button id="btn-rescan-workspace" title="Rescan workspace files">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button id="btn-clear-workspace" title="Clear workspace">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div id="editor-container"></div>
  <div id="paste-hint">📎 Image pasted</div>
  
  <!-- Template Mode Indicator -->
  <div id="template-mode-indicator" class="template-mode-indicator">
    🎨 Template Mode
    <button id="btn-fill-template">Fill</button>
    <button id="btn-exit-template-mode">Exit</button>
  </div>
  
  <!-- Send Confirmation Dialog -->
  <div id="confirm-dialog" class="modal">
    <div class="modal-content">
      <h3>Send Prompt?</h3>
      <p>Press Enter to confirm, Escape to cancel</p>
      <div class="modal-preview" id="confirm-preview"></div>
      <div class="modal-select">
        <label>Send to:</label>
        <select id="confirm-target">
          <option value="default">🖥️ Default Terminal</option>
          <option value="copy">📋 Copy Only</option>
        </select>
      </div>
      <div class="modal-checkbox">
        <label class="checkbox-label">
          <input type="checkbox" id="confirm-inline-files" />
          <span>Include file contents inline</span>
        </label>
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-send">Cancel</button>
        <button id="btn-confirm-send" class="primary">Send (↵)</button>
      </div>
    </div>
  </div>
  
  <!-- Toast notification -->
  <div id="toast"></div>
  <script type="module" src="/src/editor.ts"></script>
</body>
</html>
