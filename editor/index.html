      <button id="btn-ai-settings" class="icon-btn-toolbar" title="AI Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
      </button>
      <div class="toolbar-separator"></div>
      <button id="btn-save" class="icon-btn-toolbar accent" title="Save to History (⌘S)">
        <svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
      </button>
      <button id="btn-copy" class="icon-btn-toolbar primary" title="Copy to Clipboard (⌘⇧C)">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      </button>
      <button id="btn-clear" class="icon-btn-toolbar" title="Clear Editor">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      <select id="target-select" title="Select running agent" hidden>
        <option value="default">🖥️ Default Terminal</option>
        <option value="copy">📋 Copy Only</option>
      </select>
      <button id="btn-paste-previous" class="icon-btn-toolbar primary" title="Paste to Last Position">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
  <div id="accessibility-permission-banner" hidden role="status" aria-live="polite">
    <span id="accessibility-permission-message"></span>
    <div class="permission-actions">
      <button id="btn-open-accessibility-settings">Open Security Settings</button>
      <button id="btn-restart-after-accessibility" class="primary" hidden>Restart Prompt Editor</button>
    </div>
  </div>
  <div id="prompt-memory-root"></div>
  <div id="workspace-bar">
    <span id="workspace-info">
      <span id="workspace-current">No workspace selected</span>
    </span>
    <select id="workspace-history-select" title="Recent Workspaces">
      <option value="">📋 Recent workspaces...</option>
    </select>
    <button id="btn-switch-workspace" title="Browse for workspace">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V6h5.17l2 2H20v10z"/></svg>
    </button>
    <button id="btn-rescan-workspace" title="Rescan workspace files">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button id="btn-clear-workspace" title="Clear workspace">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>
  <div id="editor-container"></div>
  <div id="paste-hint">📎 Image pasted</div>
  
  <!-- Template Mode Indicator -->
  <div id="template-mode-indicator" class="template-mode-indicator">
    🎨 Template Mode
    <button id="btn-fill-template">Fill</button>
    <button id="btn-exit-template-mode">Exit</button>
  </div>
  
  <!-- Send Confirmation Dialog -->
  <div id="confirm-dialog" class="modal" hidden>
    <div class="modal-content">
      <h3>Send Prompt?</h3>
      <p>Press Enter to confirm, Escape to cancel</p>
      <div class="modal-preview" id="confirm-preview"></div>
      <div class="modal-select">
        <label>Send to:</label>
        <select id="confirm-target">
          <option value="default">🖥️ Default Terminal</option>
          <option value="copy">📋 Copy Only</option>
        </select>
      </div>
      <div class="modal-checkbox">
        <label class="checkbox-label">
          <input type="checkbox" id="confirm-inline-files" />
          <span>Include file contents inline</span>
        </label>
      </div>
      <div class="modal-actions">
        <button id="btn-cancel-send">Cancel</button>
        <button id="btn-confirm-send" class="primary">Send (↵)</button>
      </div>
    </div>
  </div>
  
  <!-- Toast notification -->
  <div id="toast"></div>
  <script type="module" src="/src/editor.ts"></script>
</body>
</html>
