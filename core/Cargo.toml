[package]
name = "prompt-editor-core"
version = "0.1.0"
edition = "2021"
description = "Core storage, scanning, Markdown, and FFI services for Prompt Editor"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
arboard = "3"
pulldown-cmark = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1"

[build-dependencies]
cbindgen = "0.26"

[dev-dependencies]
tempfile = "3"
